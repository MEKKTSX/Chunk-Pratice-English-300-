<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>English Sentence Bank</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ESB Thai">
    <link rel="apple-touch-icon" href="icon.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    
    <style>
        body { 
            -webkit-tap-highlight-color: transparent; 
            overscroll-behavior-y: none;
            touch-action: pan-y;
        }
        .card-tap-active:active { transform: scale(0.98); }
        .quiz-card {
            transition: transform 0.3s ease-out, opacity 0.3s ease-out;
            position: absolute;
            width: 100%; height: 100%;
            backface-visibility: hidden;
        }
        .card-stack-effect {
            transform: scale(0.95) translateY(10px);
            opacity: 0.5; z-index: -1;
        }
        @keyframes bounce-in-up {
            0% { transform: translate(-50%, 100px); opacity: 0; }
            60% { transform: translate(-50%, -10px); opacity: 1; }
            100% { transform: translate(-50%, 0); }
        }
        .animate-bounce-in { animation: bounce-in-up 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>

    <script>
        // สร้างกระเป๋าเปล่าๆ ไว้รอรับข้อมูลจากไฟล์อื่น
        window.ESB_Sessions = []; 
        window.ESB_Features = {}; 
    </script>

    <script src="./data/session1.js"></script>
    <script src="./data/session2.js"></script>
    <script src="./data/session3.js"></script>

    <script type="text/babel" src="./features/resetFeature.js"></script>
    <script type="text/babel" src="./features/audioFeature.js"></script>
    
    <script type="text/babel" src="./features/resetFeature.js"></script>
    <script type="text/babel" src="./features/audioFeature.js"></script>
    <script type="text/babel" src="./features/notificationFeature.js"></script>
    
    </head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen pb-20 select-none overflow-x-hidden">

    <div id="root"></div>

    <script type="text/babel" src="./app.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker Registered'))
                    .catch(err => console.log('Service Worker Failed', err));
            });
        }
    </script>
</body>
</html>
